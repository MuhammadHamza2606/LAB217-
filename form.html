<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>


    <form>
          <label>Name</label>
    <input type="text" placeholder="Enter your name" autofocus required pattern="[a-zA-Z]{3,50}">
<br><br>
<label>Pass</label>
<input type="password" placeholder="Enter your Password" autofocus required pattern="[a-zA-Z]{4}@{1}[0-9]{3}">
<br><br>
<label></label>
<input type="email" placeholder="Enter your Email" autofocus required>
<br><br>
<label>Phone</label>
<input type="telephone" placeholder="Enter your Phone number" autofocus required>
<br><br>
<label>Gender:</label>
<input type="radio">Male 
<input type="radio">FeMale 
<br><br>
<label>Course:</label>
<input type="checkbox">HTML
<input type="checkbox">CSS
<input type="checkbox">JS
<br><br>
<input type="submit">

    </form>
  














</body>
</html>
